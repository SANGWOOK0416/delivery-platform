server:
  port: 8082

logging:
  charset:
    console: UTF-8

spring:
  application:
    name: weather-agent
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${WEATHER_KAFKA_GROUP_ID:weather-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.portfolio.common.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kma:
  api:
    service-key: ${KMA_SERVICE_KEY:}
    base-url: ${KMA_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
    grid:
      nx: ${KMA_GRID_NX:60}
      ny: ${KMA_GRID_NY:127}

kakao:
  local:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
